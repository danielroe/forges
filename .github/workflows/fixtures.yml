name: fixtures

on:
  schedule:
    - cron: '23 4 * * 1' # reads
    - cron: '23 6 * * 1' # writes, once approved
  workflow_dispatch:
    inputs:
      kind:
        description: What to record
        type: choice
        options:
          - reads
          - writes
        default: reads
      forges:
        description: Forges to record, separated by spaces, or `all`
        default: all
      only:
        description: Steps to record, separated by commas, or empty for every step
        default: ''
      ref:
        description: Branch of this repository to record and open the pull request into, or empty for the default branch
        default: ''

permissions: {}

concurrency:
  group: fixtures-${{ inputs.kind || (github.event.schedule == '23 6 * * 1' && 'writes' || 'reads') }}
  cancel-in-progress: false

env:
  KIND: ${{ inputs.kind || (github.event.schedule == '23 6 * * 1' && 'writes' || 'reads') }}

jobs:
  # The recording environments deploy from the default branch only.
  plan:
    if: github.event.repository.fork == false && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      forges: ${{ steps.plan.outputs.forges }}
      kind: ${{ steps.plan.outputs.kind }}
      sha: ${{ steps.plan.outputs.sha }}
      base: ${{ steps.plan.outputs.base }}
      head: ${{ steps.plan.outputs.head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: false
          install: false

      - name: 🗺️ Plan
        id: plan
        env:
          FORGES: ${{ inputs.forges || 'all' }}
          REF: ${{ inputs.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$REF" ] || [ "$REF" = "$DEFAULT_BRANCH" ]; then
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "base=$DEFAULT_BRANCH" >> "$GITHUB_OUTPUT"
            echo "head=fixtures/$KIND" >> "$GITHUB_OUTPUT"
          else
            if ! git check-ref-format --branch "$REF" > /dev/null || [[ "$REF" == fixtures/* ]]; then
              echo "::error::\`$REF\` is not a branch the fixtures can be recorded against."
              exit 1
            fi
            if ! sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$REF" --jq '.object.sha'); then
              echo "::error::This repository has no branch \`$REF\`."
              exit 1
            fi
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
            echo "base=$REF" >> "$GITHUB_OUTPUT"
            echo "head=fixtures/$KIND-${REF//[^A-Za-z0-9._-]/-}" >> "$GITHUB_OUTPUT"
          fi
          known=$(node scripts/record-forge.ts --list "$KIND")
          if [ "$FORGES" = all ]; then
            selected=$known
          else
            selected=$(jq -cn --arg forges "$FORGES" '$forges | split(" ") | map(select(length > 0)) | unique')
          fi
          unknown=$(jq -cn --argjson selected "$selected" --argjson known "$known" '$selected - $known')
          if [ "$unknown" != '[]' ]; then
            echo "::error::These forges do not record $KIND: $unknown"
            exit 1
          fi
          echo "forges=$selected" >> "$GITHUB_OUTPUT"
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"

  # Each forge's environment holds only its credentials and, for writes, waits
  # for approval. Nothing is installed, so no dependency runs beside them.
  record:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        forge: ${{ fromJSON(needs.plan.outputs.forges) }}
    environment: fixtures-${{ matrix.forge }}${{ needs.plan.outputs.kind == 'writes' && '-writes' || '' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: false
          install: false

      - name: 📼 Record
        id: record
        env:
          FIXTURES_ENV: ${{ secrets.FIXTURES_ENV }}
          FORGE: ${{ matrix.forge }}
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          if [ -z "$FIXTURES_ENV" ]; then
            echo "::error::The fixtures-$FORGE environments have no FIXTURES_ENV secret. Create them with \`node scripts/fixtures-environments.ts\`."
            exit 1
          fi
          umask 077
          touch "$RUNNER_TEMP/summary.md"
          printf '%s\n' "$FIXTURES_ENV" > "$RUNNER_TEMP/fixtures.env"
          unset FIXTURES_ENV
          node scripts/fixture-secrets.ts mask "$RUNNER_TEMP/fixtures.env"
          only=()
          IFS=',' read -ra steps <<< "$ONLY"
          for step in "${steps[@]}"; do
            step=$(echo "$step" | xargs)
            if [ -n "$step" ]; then
              only+=(--only "$step")
            fi
          done
          if node scripts/record-forge.ts "$FORGE" --kind "$KIND" --env-file "$RUNNER_TEMP/fixtures.env" --summary "$RUNNER_TEMP/summary.md" --defer-splice "${only[@]}"; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 🔍 Search the recording for credentials
        env:
          FORGE: ${{ matrix.forge }}
        run: node scripts/fixture-secrets.ts scan "$RUNNER_TEMP/fixtures.env" "test/fixtures/$FORGE/recorded" "$RUNNER_TEMP/summary.md"

      - name: 🧹 Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/fixtures.env"

      # The artifact holds its own `recording-<kind>-<forge>/` directory, as a
      # download of one artifact lands without the directory named after it.
      - name: 📦 Stage the recording
        env:
          FORGE: ${{ matrix.forge }}
          STAGED: ${{ runner.temp }}/artifact/recording-${{ needs.plan.outputs.kind }}-${{ matrix.forge }}
        run: |
          mkdir -p "$STAGED"
          cp -R "test/fixtures/$FORGE/recorded" "$STAGED/recorded"
          cp "$RUNNER_TEMP/summary.md" "$STAGED/summary.md"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recording-${{ needs.plan.outputs.kind }}-${{ matrix.forge }}
          path: ${{ runner.temp }}/artifact/
          retention-days: 7
          if-no-files-found: error

      - name: ❌ Report failed recordings
        if: steps.record.outputs.failed == 'true'
        run: |
          echo "::error::Some recordings failed; the pull request keeps their earlier recording where it still replays."
          exit 1

  # A pull request opened with `GITHUB_TOKEN` starts no workflows, so CI is
  # dispatched on its branch, and its checks land on the head commit.
  pr:
    needs: [plan, record]
    if: always() && needs.plan.result == 'success' && needs.record.result != 'cancelled' && needs.record.result != 'skipped'
    runs-on: ubuntu-latest
    concurrency:
      group: fixtures-pr-${{ needs.plan.outputs.head }}
      cancel-in-progress: false
    permissions:
      contents: write # push the `fixtures/<kind>` branch
      pull-requests: write # open or update its pull request
      actions: write # dispatch CI on the branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: false
          install: false

      - name: 📦 Install dependencies
        run: pnpm install

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: recording-${{ needs.plan.outputs.kind }}-*
          path: ${{ runner.temp }}/recordings
          merge-multiple: true

      - name: 📥 Apply the recordings
        run: |
          mkdir -p "$RUNNER_TEMP/recordings"
          node scripts/apply-recordings.ts "$RUNNER_TEMP/recordings" --kind "$KIND" --summary "$RUNNER_TEMP/summary.md"

      - name: 🪡 Splice partial write runs into their recordings
        if: needs.plan.outputs.kind == 'writes'
        run: |
          set -euo pipefail
          node scripts/splice-partial.ts > "$RUNNER_TEMP/spliced.txt" 2>&1 || echo "::warning::A write run could not be spliced, so its recording is left as committed."
          cat "$RUNNER_TEMP/spliced.txt"
          if [ -s "$RUNNER_TEMP/spliced.txt" ]; then
            {
              echo '#### spliced runs'
              echo
              echo '```text'
              tr -d '`' < "$RUNNER_TEMP/spliced.txt"
              echo '```'
            } >> "$RUNNER_TEMP/summary.md"
          fi

      - name: 🪢 Rename the identifiers write recordings created
        if: needs.plan.outputs.kind == 'writes'
        run: |
          set -euo pipefail
          node scripts/stabilise-recordings.ts > "$RUNNER_TEMP/renamed.txt"
          cat "$RUNNER_TEMP/renamed.txt"
          {
            echo '#### renamed ids'
            echo
            echo '```text'
            tr -d '`' < "$RUNNER_TEMP/renamed.txt"
            echo '```'
          } >> "$RUNNER_TEMP/summary.md"

      - name: 🧪 Update the golden output
        run: pnpm vitest run --project unit test/recorded.test.ts -u || echo "::warning::Some recordings do not replay; CI on the pull request shows which."

      - name: 🔀 Open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.plan.outputs.head }}
          BASE: ${{ needs.plan.outputs.base }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -q -B "$BRANCH"
          git add -A test/fixtures
          forges=$(git diff --cached --name-only -- test/fixtures | cut -d/ -f3 | sort -u)
          git reset -q
          if [ -z "$forges" ]; then
            echo "No recording changed."
            exit 0
          fi
          for forge in $forges; do
            git add -A "test/fixtures/$forge"
            git commit -q -m "test($forge): re-record $KIND"
          done
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push -q --force "https://github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$BRANCH"
          {
            names=$(printf '`%s`, ' $forges)
            if [ "$BASE" = "$DEFAULT_BRANCH" ]; then
              echo "re-recorded the fixture $KIND for ${names%, } ([run]($RUN_URL)), with a commit per forge."
            else
              echo "re-recorded the fixture $KIND for ${names%, } against \`$BASE\` ([run]($RUN_URL)), with a commit per forge."
            fi
            echo
            echo "steps that only changed in rate limits, counters or timestamps are omitted."
            if [ "$KIND" = writes ]; then
              echo
              echo "issue and PR numbers and other ids this run created have been swapped back to the ones already committed, if that doesn't affect test output."
            fi
            echo
            echo '<details><summary>recorder output</summary>'
            echo
            cat "$RUNNER_TEMP/summary.md"
            echo
            echo '</details>'
          } > "$RUNNER_TEMP/body.md"
          number=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&head=${GITHUB_REPOSITORY%%/*}:$BRANCH" --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            jq -n --rawfile body "$RUNNER_TEMP/body.md" '{ body: $body }' | gh api --method PATCH "repos/$GITHUB_REPOSITORY/pulls/$number" --input - --silent
          else
            title="test: re-record fixture $KIND"
            if [ "$BASE" != "$DEFAULT_BRANCH" ]; then
              title="$title for \`$BASE\`"
            fi
            jq -n --rawfile body "$RUNNER_TEMP/body.md" --arg head "$BRANCH" --arg base "$BASE" --arg title "$title" '{ title: $title, head: $head, base: $base, body: $body }' | gh api --method POST "repos/$GITHUB_REPOSITORY/pulls" --input - --silent
          fi
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
