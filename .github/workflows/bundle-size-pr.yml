name: bundle size comment

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] only default-branch code runs; artifacts are validated as measurement data
    workflows:
      - bundle size
    types:
      - completed

permissions: {}

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    concurrency:
      group: bundle-size-comment-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: false
          install: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle-sizes
          path: ${{ runner.temp }}/bundle-sizes
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Update bundle size comment
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          numbers=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" --jq '.[] | select(.head.sha == env.HEAD_SHA) | .number')
          number=${numbers%%$'\n'*}
          if [ -z "$number" ]; then
            echo "No open pull request has head $HEAD_SHA."
            exit 0
          fi
          node scripts/bundle-size-diff.ts --base "$RUNNER_TEMP/bundle-sizes/base.json" --head "$RUNNER_TEMP/bundle-sizes/head.json" > "$RUNNER_TEMP/comment.md"
          printf '\nMeasured for `%s`.\n' "$HEAD_SHA" >> "$RUNNER_TEMP/comment.md"
          comments=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$number/comments?per_page=100" --jq '.[] | select(.user.login == "github-actions[bot]" and ((.body // "") | startswith("<!-- forges:bundle-size -->"))) | .id')
          comment=${comments%%$'\n'*}
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$number" --jq .head.sha)" != "$HEAD_SHA" ]; then
            echo "#$number has moved on from $HEAD_SHA."
            exit 0
          fi
          if [ -n "$comment" ]; then
            jq -n --rawfile body "$RUNNER_TEMP/comment.md" '{ body: $body }' | gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment" --input - --silent
          else
            jq -n --rawfile body "$RUNNER_TEMP/comment.md" '{ body: $body }' | gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$number/comments" --input - --silent
          fi
