name: agent-scan

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] only renames the PR title via the API without checking out anything
    types:
      - closed

permissions: {}

jobs:
  rename:
    permissions:
      pull-requests: write
    if: >-
      !github.event.pull_request.merged
      && contains(github.event.pull_request.labels.*.name, 'possible bot')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              title: '🚨 unwelcome pr from bot 🚨',
            })
