name: release

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
    branches: [main]
  # merged release PRs, publish reruns, and prereleases all arrive here
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Cut a prerelease instead of a normal release, e.g. `beta`, `rc`, or `0`'
        required: false
        default: ''
      npm-tag:
        description: npm dist-tag to publish to. Set by uppt/release for maintenance lines; leave blank otherwise
        required: false
        default: ''

permissions: {}

jobs:
  # Parse commits since the last tag, push a `release/vX.Y.Z` branch, open
  # or update a draft release PR, and close any superseded release PRs
  # (e.g. `release/v1.0.1` when the bump is now `release/v1.1.0`).
  pr:
    if: |
      !github.event.repository.fork
      && (
        (
          github.event_name == 'push'
          && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        ) || (
          github.event_name == 'workflow_dispatch'
          && !startsWith(github.ref, 'refs/tags/')
        )
      )
    runs-on: ubuntu-latest
    concurrency:
      group: release-pr
      cancel-in-progress: true
    permissions:
      contents: write # push the `release/vX.Y.Z` branch and delete superseded ones
      pull-requests: write # create a release PR, update its body, close superseded PRs
    steps:
      - uses: danielroe/uppt/pr@6ec27140623aa835e362f866d8ab0018ab057f4d # v0.6.11
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: ${{ inputs.prerelease }}

      # Writes the capability changes since the last release into the preamble
      # of the release PR, above uppt's first `## 👉` heading, which uppt keeps
      # when it regenerates the rest of the body. The release notes are cut
      # from that body.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: capabilities
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: false
          install: false
          package-json-file: capabilities/package.json

      - name: 📝 Describe capability changes in the release PR
        working-directory: capabilities
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          tag=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -z "$tag" ]; then
            echo "No release tag to compare against."
            exit 0
          fi
          numbers=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&base=$DEFAULT_BRANCH&per_page=100" --jq '.[] | select(.head.repo.full_name == env.GITHUB_REPOSITORY and (.head.ref | startswith("release/v"))) | .number')
          number=${numbers%%$'\n'*}
          if [ -z "$number" ]; then
            echo "No open release PR."
            exit 0
          fi
          node scripts/capability-snapshot.ts --ref "$tag" --out "$RUNNER_TEMP/base.json"
          node scripts/capability-snapshot.ts --out "$RUNNER_TEMP/head.json"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$number" --jq '.body // ""' > "$RUNNER_TEMP/body.md"
          node scripts/capability-diff.ts --base "$RUNNER_TEMP/base.json" --head "$RUNNER_TEMP/head.json" --body "$RUNNER_TEMP/body.md" --out "$RUNNER_TEMP/new-body.md" --before '## 👉 ' --coverage --icons "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$DEFAULT_BRANCH/assets/providers/"
          if [ ! -f "$RUNNER_TEMP/new-body.md" ]; then
            exit 0
          fi
          if [ "$(wc -c < "$RUNNER_TEMP/new-body.md")" -gt 65536 ]; then
            echo "::warning::The release PR body with capability changes exceeds 65536 bytes; leaving it as is."
            exit 0
          fi
          jq -n --rawfile body "$RUNNER_TEMP/new-body.md" '{ body: $body }' | gh api --method PATCH "repos/$GITHUB_REPOSITORY/pulls/$number" --input - --silent
          echo "Updated the capability section of #$number since $tag."

  # The release PR was merged: tag the squash commit, cut a GitHub release
  # from the PR body, and dispatch the publish workflow. The `release/v`
  # head-ref guard keeps regular feature-PR merges from triggering this;
  # the head-repo guard keeps merged fork PRs from triggering it.
  release:
    if: |
      github.event_name == 'pull_request'
      && github.event.pull_request.merged == true
      && startsWith(github.event.pull_request.head.ref, 'release/v')
      && github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.repository.fork
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write # push the `vX.Y.Z` tag and create the GitHub release
      actions: write # `gh workflow run release.yml --ref vX.Y.Z` chained dispatch
    steps:
      - uses: danielroe/uppt/release@6ec27140623aa835e362f866d8ab0018ab057f4d # v0.6.11
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # The chained dispatch from `release` lands here as a `workflow_dispatch`
  # event on a `vX.Y.Z` tag ref. The `pack` job installs deps, runs
  # `pnpm pack` (or `npm pack`), and uploads the tarball as a workflow
  # artifact. Manual recovery uses the same path (Run workflow -> pick a `v*` tag).
  pack:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency:
      group: pack-${{ github.ref }}
      cancel-in-progress: false
    permissions: {}
    outputs:
      files: ${{ steps.pack.outputs.files }}
    steps:
      - id: pack
        uses: danielroe/uppt/pack@6ec27140623aa835e362f866d8ab0018ab057f4d # v0.6.11

  # `publish` downloads the prebuilt tarball from the pack job's
  # artifact and stages it for publish.
  publish:
    if: |
      github.event_name == 'workflow_dispatch'
      && startsWith(github.ref, 'refs/tags/v')
      && needs.pack.outputs.files != '[]'
    needs: pack
    runs-on: ubuntu-latest
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      id-token: write # OIDC claim for npm trusted publisher
    environment: npm # must match the trusted-publisher entry on npmjs.com
    steps:
      - uses: danielroe/uppt/publish@6ec27140623aa835e362f866d8ab0018ab057f4d # v0.6.11
        with:
          files: ${{ needs.pack.outputs.files }}
          npm-tag: ${{ inputs.npm-tag }}
