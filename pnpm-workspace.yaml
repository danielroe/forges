minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@nuxt/kit@4.6.2'
  - '@nuxt/nitro-server@4.6.2'
  - '@nuxt/schema@4.6.2'
  - '@nuxt/vite-builder@4.6.2'
  - '@nuxt/vite-server@4.6.2'
  - nuxt@4.6.2
  - cssnano@9.9.0

trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1

shellEmulator: true

packages:
  - docs
  - playground
  - examples/*

overrides:
  forges: 'workspace:*'
  # Newer versions overflow the stack in `remark-mdc`, which breaks `llms-full.txt`: https://github.com/nuxt-content/remark-mdc/issues/161
  mdast-util-to-markdown: 2.1.2

allowBuilds:
  better-sqlite3: false
  esbuild: false
  simple-git-hooks: true
  vue-demi: false
